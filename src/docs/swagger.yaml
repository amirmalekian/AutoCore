definitions:
  api_handler.personData:
    properties:
      first_name:
        maxLength: 10
        minLength: 4
        type: string
      last_name:
        maxLength: 20
        minLength: 6
        type: string
      phone_number:
        maxLength: 11
        minLength: 11
        type: string
    required:
    - first_name
    - last_name
    - phone_number
    type: object
  github_com_amirmalekian_Mashinchi_src_api_dto.GetOtpRequest:
    properties:
      phoneNumber:
        maxLength: 11
        minLength: 11
        type: string
    required:
    - phoneNumber
    type: object
  github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse:
    properties:
      error: {}
      result: {}
      result_code:
        $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.ResultCode'
      success:
        type: boolean
      validation_errors:
        items:
          $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_validation.ValidationError'
        type: array
    type: object
  github_com_amirmalekian_Mashinchi_src_api_helper.ResultCode:
    enum:
    - 0
    - 40001
    - 40101
    - 40301
    - 40401
    - 42901
    - 42902
    - 50001
    - 50002
    type: integer
    x-enum-varnames:
    - Success
    - ValidationError
    - AuthError
    - ForbiddenError
    - NotFoundError
    - LimiterError
    - OtpLimiterError
    - CustomRecovery
    - InternalError
  github_com_amirmalekian_Mashinchi_src_api_validation.ValidationError:
    properties:
      message:
        type: string
      property:
        type: string
      tag:
        type: string
      value:
        type: string
    type: object
info:
  contact: {}
paths:
  /v1/health/:
    get:
      consumes:
      - application/json
      description: Health Check
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
      summary: Health Check
      tags:
      - health
  /v1/test/binder/body:
    post:
      consumes:
      - application/json
      description: BodyBinder
      parameters:
      - description: person data
        in: body
        name: person
        required: true
        schema:
          $ref: '#/definitions/api_handler.personData'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
      security:
      - AuthBearer: []
      summary: BodyBinder
      tags:
      - Test
  /v1/test/user/{id}:
    get:
      consumes:
      - application/json
      description: UserByID
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
      summary: UserByID
      tags:
      - Test
  /v1/users/send-otp:
    post:
      consumes:
      - application/json
      description: Send Otp to user
      parameters:
      - description: GetOtpRequest
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_dto.GetOtpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
        "400":
          description: Failed
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
        "409":
          description: Failed
          schema:
            $ref: '#/definitions/github_com_amirmalekian_Mashinchi_src_api_helper.BaseHttpResponse'
      summary: Send Otp to user
      tags:
      - Users
securityDefinitions:
  AuthBearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
